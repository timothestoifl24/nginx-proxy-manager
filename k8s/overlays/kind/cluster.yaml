# kind cluster for trying out Nginx Proxy Manager locally:
#   KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --name npm --config cluster.yaml
# Host ports are above 1024 so this also works with rootless Podman.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # HTTP
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443 # HTTPS
        hostPort: 8443
        protocol: TCP
